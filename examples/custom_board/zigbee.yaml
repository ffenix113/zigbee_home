general:
  # Because Pro Micro nRF52840 board is not supported by zephyr yet, we need to provide its whole definition by ourselves, this can be found in the "boards" folder.
  # The details on the capability of supporting custom boards can be found at: https://docs.zephyrproject.org/latest/hardware/porting/board_porting.html
  #
  # This board will be supported in Zephyr v4.1.0, but nRF Connect Zigbee AddOn may not support Zephyr v4.1.0 for some time,
  # so it is a good candidate.
  #
  # It is defined in this example with `custom_` prefix to make sure that this will work
  # even when nRF Connect will support this board natively.
  board: custom_promicro_nrf52840/nrf52840

board:
  bootloader: adafruit_nrf52_sd140_v6
  i2c:
    - id: i2c0

  factory_reset_button: btn1

  buttons:
    - id: btn1
      pin: 1.15

sensors:
  - type: scd4x
    i2c:
      id: i2c0
