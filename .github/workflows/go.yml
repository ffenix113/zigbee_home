name: Go tests

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum
      - name: Test
        run: go test -v ./...

  build:
    # While Go supports native cross-compilation - there are still platform-specific things.
    # For example libraries and headers.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-slim]
    # Do not do builds on pull requests.
    # Maybe this will be lifted in the future,
    # if MR builds would be useful for users
    # before they are merged.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum
      - name: Build executable
        run: mkdir builds && cd builds && go build ../cmd/zigbee_home/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigbee_home
          if-no-files-found: error
          path: builds/*
