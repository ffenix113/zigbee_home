name: Build firmware

on:
  workflow_dispatch:
  # Runs when PR events occur (opened, reopened, synchronize = new commits on the PR, etc.)
  pull_request:
    types: [
        opened,
        reopened,
        synchronize,
        # ready_for_review,
        # edited,
        # converted_to_draft,
      ]
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  # Somehow we should try to keep Add On and Toolchain in sync.
  # But as we download toolchain before Add On - we can't fetch
  # version from downloaded Add On.
  #
  # Technically we could resolve latest tag, then fetch the west.yml,
  # parse it and return 'manifest.projects[0].revision'. Though sounds like a handful.
  #
  # Though I can confirm that having SDK verion of 2.9.2 works with Toolchain v3.1.0
  ZIGBEE_ADD_ON_VERSION: v1.2.1
  TOOLCHAIN_VERSION: v3.1.1
  GO_VERSION: "1.24"
  NRFUTIL_VERSION: "8.1.1"

jobs:
  prepare_build_matrix:
    runs-on: ubuntu-slim
    outputs:
      examples: ${{steps.list_examples.outputs.examples}}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare examples matrix
        id: list_examples
        run: |
          EXAMPLES=$(find ./examples/ -type d -mindepth 1 -maxdepth 1 | sed -nE 's/\.\/examples\/(.*)/\1/p' |jq -cnR '[inputs | select(length>0)]')
          echo "Found examples: ${EXAMPLES}"
          echo "examples=${EXAMPLES}" >> $GITHUB_OUTPUT
  prepare_sdk_cache:
    strategy:
      matrix: 
        include:
          - runs-on: ubuntu-latest
            binary: x86_64-unknown-linux-gnu
            nrfutil-version: 8.1.1
            zigbee-version: v1.2.1
            toolchain-version: v3.1.1
          # - runs-on: macos-latest
          #   binary: aarch64-apple-darwin
          #   nrfutil-version: 8.1.1
          #   zigbee-version: v1.2.1
          #   toolchain-version: v3.1.1
          # - runs-on: windows-latest
          #   binary: x86_64-pc-windows-msvc
          #   nrfutil-version: 8.1.1
          #   zigbee-version: v1.2.1
          #   toolchain-version: v3.1.1
    uses: ./.github/workflows/setup_sdk.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      binary: ${{ matrix.binary }}
      nrfutil-version: ${{ matrix.nrfutil-version }}
      zigbee-version: ${{ matrix.zigbee-version }}
      toolchain-version: ${{ matrix.toolchain-version }}

  # This job will run builders on multiple OSes,
  # so we know that they will all work.
  # Cache may not work here, as it is os-specific.
  build_oses:
    needs: [prepare_sdk_cache]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            exe: zigbee_home
            nrfutil_path:
          - runner: windows-latest
            exe: zigbee_home.exe
            nrfutil_path:
          - runner: ubuntu-slim
            exe: zigbee_home
            nrfutil_path:
    # Run all builds once to see what we have.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build executable
        run: go build ./cmd/zigbee_home/; chmod +x ./${{ matrix.exe }}

      - name: Generate firmware
        env:
          # Let zigbee_home know that env is already set up.
          NO_SETUP_ENV: 1
          # Env for example with resolution of custom tags & env variables.
          ZBHOME_BOARD: xiao_ble
        run: ./${{ matrix.exe }} firmware --workdir ./build build --only-generate --config zigbee.yaml


  build_firmware:
    runs-on: ubuntu-latest
    needs: [prepare_build_matrix, prepare_sdk_cache]
    # Run all builds once to see what we have.
    continue-on-error: true
    strategy:
      # Do not be greedy. We already have at least 15 jobs to run.
      max-parallel: 8
      matrix:
        examples: ${{fromJson(needs.prepare_build_matrix.outputs.examples)}}
        # Add root configuration as well, to make sure that it works.
        include:
          - examples: ..
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build executable
        run: go build ./cmd/zigbee_home/; chmod +x ./zigbee_home

      - name: Restore cached SDK
        if: ${{ !env.ACT }}
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/nrfutil
            ~/.nrfutil/bin
            ~/ncs/toolchains
            ~/ncs/zigbee_sdk_${{ env.ZIGBEE_ADD_ON_VERSION }}
          key: ${{ runner.os }}-zigbee-sdk-${{ env.ZIGBEE_ADD_ON_VERSION }}-nrfutil-${{ env.NRFUTIL_VERSION }}
      - name: List installed toolchains and sdks
        run: |
          echo "::group::NRFUtil version"
          ./nrfutil -V
          echo "::endgroup::"
          echo "::group::Installed toolchains"
          ./nrfutil toolchain-manager list
          echo "::endgroup::"
          echo "::group::Installed SDKs"
          cd ~/ncs/ && find . -maxdepth 3 -name "VERSION" -exec echo {} \; -exec cat {} \;
          echo "::endgroup::"

      - name: Build firmware
        env:
          # Let zigbee_home know that env is already set up.
          NO_SETUP_ENV: 1
          # Env for example with resolution of custom tags & env variables.
          ZBHOME_BOARD: xiao_ble
        run: |
          export ZEPHYR_BASE=~/ncs/zigbee_sdk_${ZIGBEE_ADD_ON_VERSION}/zephyr
          echo "Set ZEPHYR_BASE at ${ZEPHYR_BASE}."

          ./nrfutil toolchain-manager launch --ncs-version ${TOOLCHAIN_VERSION} -- bash -c './zigbee_home firmware --workdir ./examples/${{ matrix.examples }} build --config ./examples/${{ matrix.examples }}/zigbee.yaml'
